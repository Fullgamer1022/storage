name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - name: Baixar Gradle 2.14.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip
      - name: Pre-baixar arquivos do Minecraft 1.7.10
        run: |
          C=~/.gradle/caches/minecraft
          mkdir -p $C/assets/indexes $C/net/minecraft/minecraft/1.7.10 $C/net/minecraft/minecraft_server/1.7.10
          curl -fL https://launchermeta.mojang.com/v1/packages/1863782e33ce7b584fc45b037325a1964e095d3e/1.7.10.json -o $C/assets/indexes/1.7.10.json
          curl -fL https://launcher.mojang.com/v1/objects/e80d9b3bf5085002218d4be59e668bac718abbc6/client.jar -o $C/net/minecraft/minecraft/1.7.10/minecraft-1.7.10.jar
          curl -fL https://launcher.mojang.com/v1/objects/952438ac4e01b4d115c5fc38f891710c4941df29/server.jar -o $C/net/minecraft/minecraft_server/1.7.10/minecraft_server-1.7.10.jar
          printf "19fe84ab66a122651131258a094288bd\r\nfb13447628d6bf8de5cdecb9ef24a470" > $C/net/minecraft/minecraft/1.7.10/minecraft-1.7.10.jar.md5
          printf "a20d0a93c6e9cbf1d07db1a1f009aa7a\r\n07d67ba0c30e852c27ab2d9f9b234001" > $C/net/minecraft/minecraft_server/1.7.10/minecraft_server-1.7.10.jar.md5
      - name: Compilar
        run: ./gradle-2.14.1/bin/gradle setupCIWorkspace build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: StorageNet-jar
          path: build/libs/*.jar
